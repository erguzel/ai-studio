version: 2
updates:
  # the package itself
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  # the example's pinned stack
  - package-ecosystem: pip
    directory: /examples/bbc-news-classification
    schedule:
      interval: weekly
    ignore:
      # numpy 2.5 raised its floor to python 3.12; this example's stack is
      # resolved on 3.11 in CI. drop this once the supported floor moves.
      - dependency-name: numpy
        versions: [">=2.5"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
