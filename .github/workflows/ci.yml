name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its dev extras
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  example:
    name: bbc example on the lowest supported python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      # the pinned stack is what a reader installs; resolving it here is the
      # only place a pin that no longer fits the supported pythons shows up
      - name: Install the example's pinned stack
        working-directory: examples/bbc-news-classification
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Import the example without running it
        working-directory: examples/bbc-news-classification
        run: python -c "import run_pipeline"
